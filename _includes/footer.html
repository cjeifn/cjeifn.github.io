{% assign image = page.footer | default: site.footer %}
{% assign dark = page.footer-dark | is_nil: site.footer-dark | is_nil: true %}

<footer
  class="background site-footer"
  style="--image: url('{{ image | relative_url | uri_escape }}')"
  {% if dark == true or dark == false %}
    data-dark="{{ dark }}"
  {% endif %}
  data-size="wide"
>
  <div class="footer-copyright">
    &copy; {{ site.time | date: "%Y" }}
    Cheongju National University of Education Institute for Foundational Numeracy. All Rights Reserved.
  </div>
</footer>

<style>
  .site-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0 !important;
    padding: 28px 20px !important;
    text-align: center;
  }

  .footer-copyright {
    margin: 0;
    font-size: 12px;
    line-height: 1.6;
    opacity: 0.75;
  }
</style>
